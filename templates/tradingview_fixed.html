<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TradingView Fixed - TradeBot</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: #1a1a1a;
            color: white;
            margin: 0;
            padding: 20px;
        }
        .chart-container {
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
            padding: 20px;
            margin: 20px 0;
        }
        .controls {
            background: rgba(255,255,255,0.1);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        .btn-custom {
            background: linear-gradient(45deg, #00d4aa, #0099cc);
            border: none;
            color: white;
            border-radius: 25px;
            padding: 8px 16px;
            margin: 0 5px;
        }
        .btn-custom:hover {
            transform: translateY(-1px);
            color: white;
        }
        #tradingview-widget {
            height: 600px;
            width: 100%;
        }
        .status {
            padding: 10px;
            border-radius: 5px;
            margin: 10px 0;
        }
        .status.success { background: rgba(0,255,0,0.2); }
        .status.error { background: rgba(255,0,0,0.2); }
        .status.info { background: rgba(0,150,255,0.2); }
    </style>
</head>
<body>
    <div class="container-fluid">
        <h1 class="mb-4">📈 TradingView График (Исправленная версия)</h1>
        
        <div id="status" class="status info">
            Загрузка TradingView...
        </div>
        
        <div class="controls">
            <div class="row align-items-center">
                <div class="col-md-3">
                    <label class="form-label">Символ:</label>
                    <select class="form-select" id="symbolSelect">
                        <option value="BTCUSDT">BTCUSDT</option>
                        <option value="ETHUSDT">ETHUSDT</option>
                        <option value="SOLUSDT">SOLUSDT</option>
                        <option value="ADAUSDT">ADAUSDT</option>
                        <option value="DOTUSDT">DOTUSDT</option>
                        <option value="LINKUSDT">LINKUSDT</option>
                        <option value="MATICUSDT">MATICUSDT</option>
                        <option value="AVAXUSDT">AVAXUSDT</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label">Интервал:</label>
                    <select class="form-select" id="intervalSelect">
                        <option value="1">1m</option>
                        <option value="5">5m</option>
                        <option value="15" selected>15m</option>
                        <option value="30">30m</option>
                        <option value="60">1h</option>
                        <option value="240">4h</option>
                        <option value="1D">1D</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label">Тема:</label>
                    <select class="form-select" id="themeSelect">
                        <option value="dark" selected>Темная</option>
                        <option value="light">Светлая</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label">&nbsp;</label>
                    <div>
                        <button class="btn btn-custom" onclick="updateChart()">
                            <i class="fas fa-sync-alt"></i> Обновить
                        </button>
                        <button class="btn btn-custom" onclick="testConnection()">
                            <i class="fas fa-wifi"></i> Тест
                        </button>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="chart-container">
            <div id="tradingview-widget"></div>
        </div>
        
        <div class="mt-3 text-center">
            <a href="/" class="btn btn-outline-light">
                <i class="fas fa-arrow-left"></i> Вернуться к TradeBot
            </a>
        </div>
    </div>

    <script>
        let widget = null;
        let currentSymbol = 'BTCUSDT';
        let currentInterval = '15';
        let currentTheme = 'dark';

        function updateStatus(message, type = 'info') {
            const statusDiv = document.getElementById('status');
            statusDiv.textContent = message;
            statusDiv.className = `status ${type}`;
        }

        function testConnection() {
            updateStatus('Тестируем подключение к TradingView...', 'info');
            
            // Проверяем доступность TradingView
            fetch('https://www.tradingview.com', { mode: 'no-cors' })
                .then(() => {
                    updateStatus('TradingView доступен', 'success');
                })
                .catch(() => {
                    updateStatus('Ошибка подключения к TradingView', 'error');
                });
        }

        function loadTradingViewScript() {
            return new Promise((resolve, reject) => {
                // Проверяем, не загружен ли уже скрипт
                if (window.TradingView) {
                    resolve();
                    return;
                }

                updateStatus('Загружаем TradingView скрипт...', 'info');
                
                const script = document.createElement('script');
                script.type = 'text/javascript';
                script.src = 'https://s3.tradingview.com/tv.js';
                script.async = true;
                
                script.onload = () => {
                    updateStatus('TradingView скрипт загружен', 'success');
                    resolve();
                };
                
                script.onerror = () => {
                    updateStatus('Ошибка загрузки TradingView скрипта', 'error');
                    reject(new Error('Failed to load TradingView script'));
                };
                
                document.head.appendChild(script);
            });
        }

        function createWidget() {
            if (!window.TradingView) {
                updateStatus('TradingView не загружен', 'error');
                return;
            }

            updateStatus('Создаем виджет...', 'info');
            
            const container = document.getElementById('tradingview-widget');
            container.innerHTML = ''; // Очищаем контейнер
            
            try {
                widget = new TradingView.widget({
                    "width": "100%",
                    "height": "100%",
                    "symbol": `BINANCE:${currentSymbol}`,
                    "interval": currentInterval,
                    "timezone": "Europe/Moscow",
                    "theme": currentTheme,
                    "style": "1",
                    "locale": "ru",
                    "toolbar_bg": "#f1f3f6",
                    "enable_publishing": false,
                    "hide_side_toolbar": false,
                    "allow_symbol_change": true,
                    "container_id": "tradingview-widget",
                    "studies": [
                        "MASimple@tv-basicstudies",
                        "RSI@tv-basicstudies"
                    ],
                    "show_popup_button": true,
                    "popup_width": "1000",
                    "popup_height": "650",
                    "save_image": true,
                    "details": true,
                    "hotlist": true,
                    "calendar": true
                });
                
                updateStatus('Виджет создан успешно!', 'success');
                
            } catch (error) {
                updateStatus(`Ошибка создания виджета: ${error.message}`, 'error');
                console.error('Widget creation error:', error);
            }
        }

        function updateChart() {
            if (widget) {
                const symbol = document.getElementById('symbolSelect').value;
                const interval = document.getElementById('intervalSelect').value;
                const theme = document.getElementById('themeSelect').value;
                
                currentSymbol = symbol;
                currentInterval = interval;
                currentTheme = theme;
                
                updateStatus('Обновляем график...', 'info');
                
                try {
                    widget.setSymbol(`BINANCE:${symbol}`, interval);
                    updateStatus('График обновлен', 'success');
                } catch (error) {
                    updateStatus(`Ошибка обновления: ${error.message}`, 'error');
                }
            } else {
                updateStatus('Виджет не создан', 'error');
            }
        }

        // Инициализация при загрузке страницы
        document.addEventListener('DOMContentLoaded', async function() {
            try {
                await loadTradingViewScript();
                setTimeout(() => {
                    createWidget();
                }, 1000); // Небольшая задержка для стабильности
            } catch (error) {
                updateStatus(`Ошибка инициализации: ${error.message}`, 'error');
            }
        });

        // Обработчики событий
        document.getElementById('symbolSelect').addEventListener('change', updateChart);
        document.getElementById('intervalSelect').addEventListener('change', updateChart);
        document.getElementById('themeSelect').addEventListener('change', function() {
            // Для смены темы нужно пересоздать виджет
            currentTheme = this.value;
            createWidget();
        });

        // Тест подключения при загрузке
        setTimeout(testConnection, 2000);
    </script>
</body>
</html>
