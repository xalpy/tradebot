<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TradingView Chart - TradeBot</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            min-height: 100vh;
        }
        .chart-container {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 20px;
            margin: 20px 0;
            backdrop-filter: blur(10px);
        }
        .controls {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
            backdrop-filter: blur(10px);
        }
        .btn-custom {
            background: linear-gradient(45deg, #00d4aa, #0099cc);
            border: none;
            color: white;
            border-radius: 25px;
            padding: 10px 20px;
            transition: all 0.3s ease;
        }
        .btn-custom:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 212, 170, 0.4);
            color: white;
        }
        .form-select, .form-control {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            border-radius: 25px;
        }
        .form-select option, .form-control::placeholder {
            color: #333;
        }
        .status-indicator {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 8px;
        }
        .status-online { background: #00ff88; }
        .status-offline { background: #ff4757; }
        .tradingview-widget-container {
            border-radius: 10px;
            overflow: hidden;
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <div class="col-12">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h1><i class="fas fa-chart-line me-2"></i>TradingView Chart</h1>
                    <div>
                        <span class="status-indicator status-online"></span>
                        <span>TradeBot Online</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Контролы -->
        <div class="controls">
            <div class="row align-items-center">
                <div class="col-md-3">
                    <label class="form-label">Символ:</label>
                    <div class="input-group">
                        <select class="form-select" id="symbolSelect">
                            <option value="BINANCE:BTCUSDT">BTCUSDT</option>
                            <option value="BINANCE:ETHUSDT">ETHUSDT</option>
                            <option value="BINANCE:SOLUSDT">SOLUSDT</option>
                            <option value="BINANCE:ADAUSDT">ADAUSDT</option>
                            <option value="BINANCE:DOTUSDT">DOTUSDT</option>
                            <option value="BINANCE:LINKUSDT">LINKUSDT</option>
                            <option value="BINANCE:MATICUSDT">MATICUSDT</option>
                            <option value="BINANCE:AVAXUSDT">AVAXUSDT</option>
                        </select>
                        <button class="btn btn-outline-light" type="button" id="refreshSymbols">
                            <i class="fas fa-sync-alt"></i>
                        </button>
                    </div>
                </div>
                <div class="col-md-2">
                    <label class="form-label">Интервал:</label>
                    <select class="form-select" id="intervalSelect">
                        <option value="1">1m</option>
                        <option value="5">5m</option>
                        <option value="15" selected>15m</option>
                        <option value="30">30m</option>
                        <option value="60">1h</option>
                        <option value="240">4h</option>
                        <option value="1D">1D</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label">Тема:</label>
                    <select class="form-select" id="themeSelect">
                        <option value="dark" selected>Темная</option>
                        <option value="light">Светлая</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label">Стиль:</label>
                    <select class="form-select" id="styleSelect">
                        <option value="1" selected>Свечи</option>
                        <option value="2">Бары</option>
                        <option value="3">Линия</option>
                        <option value="4">Площадь</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label">&nbsp;</label>
                    <div>
                        <button class="btn btn-custom me-2" id="updateChart">
                            <i class="fas fa-sync-alt me-1"></i>Обновить
                        </button>
                        <button class="btn btn-outline-light" id="fullscreenBtn">
                            <i class="fas fa-expand"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- График -->
        <div class="chart-container">
            <div id="tradingview-widget" style="height: 600px;"></div>
        </div>

        <!-- Информация -->
        <div class="row">
            <div class="col-md-6">
                <div class="controls">
                    <h5><i class="fas fa-info-circle me-2"></i>Информация о графике</h5>
                    <div id="chartInfo">
                        <p><strong>Символ:</strong> <span id="currentSymbol">BTCUSDT</span></p>
                        <p><strong>Интервал:</strong> <span id="currentInterval">15m</span></p>
                        <p><strong>Провайдер:</strong> TradingView</p>
                        <p><strong>Функции:</strong> Все индикаторы, инструменты рисования, анализ</p>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="controls">
                    <h5><i class="fas fa-cog me-2"></i>Настройки</h5>
                    <div class="form-check form-switch">
                        <input class="form-check-input" type="checkbox" id="showIndicators" checked>
                        <label class="form-check-label" for="showIndicators">
                            Показывать индикаторы
                        </label>
                    </div>
                    <div class="form-check form-switch">
                        <input class="form-check-input" type="checkbox" id="showDrawingTools" checked>
                        <label class="form-check-label" for="showDrawingTools">
                            Инструменты рисования
                        </label>
                    </div>
                    <div class="form-check form-switch">
                        <input class="form-check-input" type="checkbox" id="showNews" checked>
                        <label class="form-check-label" for="showNews">
                            Новости и анализ
                        </label>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let widget = null;
        let currentSymbol = 'BINANCE:BTCUSDT';
        let currentInterval = '15';
        let currentTheme = 'dark';
        let currentStyle = '1';

        // Инициализация виджета
        function initTradingViewWidget() {
            const container = document.getElementById('tradingview-widget');
            
            // Очищаем контейнер
            container.innerHTML = '';
            
            // Создаем новый виджет
            widget = new TradingView.widget({
                "width": "100%",
                "height": "100%",
                "symbol": currentSymbol,
                "interval": currentInterval,
                "timezone": "Europe/Moscow",
                "theme": currentTheme,
                "style": currentStyle,
                "locale": "ru",
                "toolbar_bg": "#f1f3f6",
                "enable_publishing": false,
                "hide_side_toolbar": false,
                "allow_symbol_change": true,
                "container_id": "tradingview-widget",
                "studies": [
                    "MASimple@tv-basicstudies",
                    "RSI@tv-basicstudies",
                    "MACD@tv-basicstudies"
                ],
                "show_popup_button": true,
                "popup_width": "1000",
                "popup_height": "650",
                "save_image": true,
                "details": true,
                "hotlist": true,
                "calendar": true,
                "news": [
                    "headlines"
                ]
            });

            // Обновляем информацию
            updateChartInfo();
        }

        // Обновление информации о графике
        function updateChartInfo() {
            document.getElementById('currentSymbol').textContent = currentSymbol.replace('BINANCE:', '');
            document.getElementById('currentInterval').textContent = currentInterval + 'm';
        }

        // Обработчики событий
        document.getElementById('symbolSelect').addEventListener('change', function() {
            currentSymbol = this.value;
            if (widget) {
                widget.setSymbol(currentSymbol, currentInterval);
                updateChartInfo();
            }
        });

        document.getElementById('intervalSelect').addEventListener('change', function() {
            currentInterval = this.value;
            if (widget) {
                widget.setSymbol(currentSymbol, currentInterval);
                updateChartInfo();
            }
        });

        document.getElementById('themeSelect').addEventListener('change', function() {
            currentTheme = this.value;
            initTradingViewWidget();
        });

        document.getElementById('styleSelect').addEventListener('change', function() {
            currentStyle = this.value;
            if (widget) {
                widget.setChartType(parseInt(currentStyle));
            }
        });

        document.getElementById('updateChart').addEventListener('click', function() {
            initTradingViewWidget();
        });

        document.getElementById('fullscreenBtn').addEventListener('click', function() {
            if (widget) {
                widget.fullscreen();
            }
        });

        // Загрузка популярных символов
        async function loadPopularSymbols() {
            try {
                const response = await fetch('/api/trading_pairs');
                const data = await response.json();
                
                if (data.popular && data.popular.length > 0) {
                    const select = document.getElementById('symbolSelect');
                    select.innerHTML = '';
                    
                    data.popular.forEach(pair => {
                        const option = document.createElement('option');
                        option.value = `BINANCE:${pair.symbol}`;
                        option.textContent = pair.symbol;
                        select.appendChild(option);
                    });
                    
                    currentSymbol = select.value;
                }
            } catch (error) {
                console.error('Ошибка загрузки символов:', error);
            }
        }

        // Инициализация при загрузке страницы
        document.addEventListener('DOMContentLoaded', function() {
            // Загружаем TradingView скрипт
            const script = document.createElement('script');
            script.src = 'https://s3.tradingview.com/tv.js';
            script.onload = function() {
                console.log('TradingView скрипт загружен');
                initTradingViewWidget();
                loadPopularSymbols();
            };
            script.onerror = function() {
                console.error('Ошибка загрузки TradingView скрипта');
                document.getElementById('tradingview-widget').innerHTML = 
                    '<div class="text-center p-4 text-danger">Ошибка загрузки TradingView</div>';
            };
            document.head.appendChild(script);
        });

        // Обработка изменения размера окна
        window.addEventListener('resize', function() {
            if (widget) {
                widget.resize();
            }
        });
    </script>
</body>
</html>
