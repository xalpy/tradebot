<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест стилей селектов</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #ecf0f1;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        .container {
            padding-top: 2rem;
        }
        
        /* Стили для селектов с торговыми парами */
        .form-select {
            background-color: rgba(255, 255, 255, 0.1);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
        }
        
        .form-select:focus {
            background-color: rgba(255, 255, 255, 0.15);
            color: #fff;
            border-color: rgba(255, 255, 255, 0.4);
            box-shadow: 0 0 0 0.25rem rgba(255, 255, 255, 0.1);
        }
        
        .form-select option {
            background-color: #2c3e50;
            color: #ecf0f1;
            padding: 10px 15px;
            border: none;
            font-size: 14px;
        }
        
        .form-select option:hover {
            background-color: #34495e;
            color: #fff;
        }
        
        .form-select option:checked {
            background-color: #3498db;
            color: #fff;
        }
        
        .form-select optgroup {
            background-color: #34495e;
            color: #bdc3c7;
            font-weight: bold;
            padding: 12px 15px;
            border-bottom: 1px solid #2c3e50;
            font-size: 13px;
        }
        
        .form-select optgroup option {
            background-color: #2c3e50;
            color: #ecf0f1;
            padding: 10px 20px;
            margin-left: 10px;
        }
        
        .form-select optgroup option:hover {
            background-color: #34495e;
            color: #fff;
        }
        
        .form-select optgroup option:checked {
            background-color: #3498db;
            color: #fff;
        }
        
        /* Стили для выпадающего списка в темной теме */
        .form-select:not([size]):not([multiple]) {
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3e%3cpath fill='none' stroke='%23ffffff' stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='m1 6 7 7 7-7'/%3e%3c/svg%3e");
        }
        
        /* Стили для input-group с кнопками обновления */
        .input-group .btn-outline-secondary {
            background-color: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.2);
            color: #fff;
        }
        
        .input-group .btn-outline-secondary:hover {
            background-color: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.3);
            color: #fff;
        }
        
        /* Стили для текста в формах */
        .form-label {
            color: #ecf0f1;
            font-weight: 500;
            margin-bottom: 0.5rem;
        }
        
        .form-text {
            color: #bdc3c7;
            font-size: 0.875rem;
        }
        
        /* Стили для input полей */
        .form-control {
            background-color: rgba(255, 255, 255, 0.1);
            color: #ecf0f1;
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
        }
        
        .form-control:focus {
            background-color: rgba(255, 255, 255, 0.15);
            color: #ecf0f1;
            border-color: rgba(255, 255, 255, 0.4);
            box-shadow: 0 0 0 0.25rem rgba(255, 255, 255, 0.1);
        }
        
        .form-control::placeholder {
            color: #95a5a6;
        }
        
        /* Стили для карточек */
        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .card-header {
            background: rgba(255, 255, 255, 0.1);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            color: #ecf0f1;
        }
        
        .card-body {
            color: #ecf0f1;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="text-center mb-4">Тест стилей селектов</h1>
        
        <div class="row">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h5>Бэктест</h5>
                    </div>
                    <div class="card-body">
                        <div class="mb-3">
                            <label class="form-label">Символ</label>
                            <div class="input-group">
                                <select class="form-select" id="backtestSymbol">
                                    <option value="">Выберите пару...</option>
                                    <optgroup label="🔥 Популярные пары">
                                        <option value="BTCUSDT">BTCUSDT | $45,234.56</option>
                                        <option value="ETHUSDT">ETHUSDT | $2,345.67</option>
                                        <option value="SOLUSDT">SOLUSDT | $123.45</option>
                                    </optgroup>
                                    <optgroup label="📊 Все пары (100)">
                                        <option value="BNBUSDT">BNBUSDT | $234.56 | $45.2M</option>
                                        <option value="ADAUSDT">ADAUSDT | $0.45 | $12.3M</option>
                                        <option value="XRPUSDT">XRPUSDT | $0.67 | $23.4M</option>
                                    </optgroup>
                                </select>
                                <button class="btn btn-outline-secondary" type="button">
                                    <i class="fas fa-sync-alt"></i>
                                </button>
                            </div>
                            <div class="form-text">Выберите торговую пару для бэктеста</div>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h5>Графики</h5>
                    </div>
                    <div class="card-body">
                        <div class="mb-3">
                            <label class="form-label">Символ</label>
                            <div class="input-group">
                                <select class="form-select" id="chartSymbol">
                                    <option value="">Выберите пару...</option>
                                    <optgroup label="🔥 Популярные пары">
                                        <option value="BTCUSDT">BTCUSDT | $45,234.56</option>
                                        <option value="ETHUSDT">ETHUSDT | $2,345.67</option>
                                        <option value="SOLUSDT">SOLUSDT | $123.45</option>
                                    </optgroup>
                                    <optgroup label="📊 Все пары (100)">
                                        <option value="BNBUSDT">BNBUSDT | $234.56 | $45.2M</option>
                                        <option value="ADAUSDT">ADAUSDT | $0.45 | $12.3M</option>
                                        <option value="XRPUSDT">XRPUSDT | $0.67 | $23.4M</option>
                                    </optgroup>
                                </select>
                                <button class="btn btn-outline-secondary" type="button">
                                    <i class="fas fa-sync-alt"></i>
                                </button>
                            </div>
                            <div class="form-text">Выберите торговую пару для графика</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="row mt-4">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h5>Ручная торговля</h5>
                    </div>
                    <div class="card-body">
                        <div class="mb-3">
                            <label class="form-label">Символ</label>
                            <div class="input-group">
                                <select class="form-select" id="orderSymbol" required>
                                    <option value="">Выберите пару...</option>
                                    <optgroup label="🔥 Популярные пары">
                                        <option value="BTCUSDT">BTCUSDT | $45,234.56</option>
                                        <option value="ETHUSDT">ETHUSDT | $2,345.67</option>
                                        <option value="SOLUSDT">SOLUSDT | $123.45</option>
                                    </optgroup>
                                    <optgroup label="📊 Все пары (100)">
                                        <option value="BNBUSDT">BNBUSDT | $234.56 | $45.2M</option>
                                        <option value="ADAUSDT">ADAUSDT | $0.45 | $12.3M</option>
                                        <option value="XRPUSDT">XRPUSDT | $0.67 | $23.4M</option>
                                    </optgroup>
                                </select>
                                <button class="btn btn-outline-secondary" type="button">
                                    <i class="fas fa-sync-alt"></i>
                                </button>
                            </div>
                            <div class="form-text">Выберите торговую пару для ордера</div>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h5>Автоматическая торговля</h5>
                    </div>
                    <div class="card-body">
                        <div class="mb-3">
                            <label class="form-label">Символы (через запятую)</label>
                            <div class="input-group">
                                <input type="text" class="form-control" id="tradingSymbols" value="BTCUSDT,ETHUSDT" placeholder="Введите символы через запятую">
                                <button class="btn btn-outline-secondary" type="button">
                                    <i class="fas fa-sync-alt"></i>
                                </button>
                            </div>
                            <div class="form-text">Введите символы через запятую или используйте кнопку для выбора популярных пар</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
