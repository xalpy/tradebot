<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест библиотеки LightweightCharts</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: #f0f0f0;
        }
        .test-result {
            margin: 10px 0;
            padding: 10px;
            border-radius: 5px;
        }
        .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .info { background: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; }
        #chartContainer {
            width: 100%;
            height: 400px;
            border: 1px solid #ccc;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h1>Тест библиотеки LightweightCharts</h1>
    
    <div id="status"></div>
    
    <div id="chartContainer"></div>
    
    <script>
        const statusDiv = document.getElementById('status');
        
        function addStatus(message, type = 'info') {
            const div = document.createElement('div');
            div.className = `test-result ${type}`;
            div.textContent = message;
            statusDiv.appendChild(div);
        }
        
        // Тест 1: Проверка загрузки библиотеки
        addStatus('🔍 Проверяем загрузку библиотеки...', 'info');
        
        if (typeof LightweightCharts === 'undefined') {
            addStatus('❌ LightweightCharts не загружен!', 'error');
        } else {
            addStatus('✅ LightweightCharts загружен', 'success');
        }
        
        // Тест 2: Проверка метода createChart
        if (typeof LightweightCharts !== 'undefined') {
            if (typeof LightweightCharts.createChart === 'function') {
                addStatus('✅ LightweightCharts.createChart доступен', 'success');
            } else {
                addStatus('❌ LightweightCharts.createChart не найден', 'error');
            }
        }
        
        // Тест 3: Создание тестового графика
        if (typeof LightweightCharts !== 'undefined' && typeof LightweightCharts.createChart === 'function') {
            try {
                addStatus('📈 Создаем тестовый график...', 'info');
                
                const chartContainer = document.getElementById('chartContainer');
                const chart = LightweightCharts.createChart(chartContainer, {
                    width: chartContainer.clientWidth,
                    height: chartContainer.clientHeight,
                    layout: {
                        background: { color: '#ffffff' },
                        textColor: '#333',
                    },
                    grid: {
                        vertLines: { color: '#e1e1e1' },
                        horzLines: { color: '#e1e1e1' },
                    },
                });
                
                addStatus('✅ График создан успешно', 'success');
                
                // Тест 4: Проверка метода addCandlestickSeries
                if (typeof chart.addCandlestickSeries === 'function') {
                    addStatus('✅ chart.addCandlestickSeries доступен', 'success');
                    
                    // Тест 5: Добавление тестовых данных
                    const candlestickSeries = chart.addCandlestickSeries({
                        upColor: '#26a69a',
                        downColor: '#ef5350',
                        borderVisible: false,
                        wickUpColor: '#26a69a',
                        wickDownColor: '#ef5350',
                    });
                    
                    // Создаем тестовые данные
                    const testData = [
                        { time: 1640995200, open: 100, high: 105, low: 95, close: 102 },
                        { time: 1640995260, open: 102, high: 108, low: 100, close: 106 },
                        { time: 1640995320, open: 106, high: 110, low: 104, close: 108 },
                        { time: 1640995380, open: 108, high: 112, low: 106, close: 110 },
                        { time: 1640995440, open: 110, high: 115, low: 108, close: 113 },
                    ];
                    
                    candlestickSeries.setData(testData);
                    addStatus('✅ Тестовые свечи добавлены', 'success');
                    addStatus('🎉 Библиотека работает корректно!', 'success');
                    
                } else {
                    addStatus('❌ chart.addCandlestickSeries не найден', 'error');
                }
                
            } catch (error) {
                addStatus(`❌ Ошибка при создании графика: ${error.message}`, 'error');
            }
        }
        
        // Тест 6: Проверка версии
        if (typeof LightweightCharts !== 'undefined') {
            addStatus(`ℹ️ Версия LightweightCharts: ${LightweightCharts.version || 'неизвестна'}`, 'info');
        }
    </script>
    
    <!-- Подключаем библиотеку -->
    <script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
</body>
</html>
