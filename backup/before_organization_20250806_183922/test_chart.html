<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест графика</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #ecf0f1;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        .container {
            padding-top: 2rem;
        }
        
        .chart-container {
            height: 500px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            background: rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(10px);
        }
        
        .form-select {
            background-color: rgba(255, 255, 255, 0.1);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
        }
        
        .form-select option {
            background-color: #2c3e50;
            color: #ecf0f1;
        }
        
        .btn-primary {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
        }
        
        .btn-primary:hover {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #fff;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="text-center mb-4">Тест графика</h1>
        
        <div class="row mb-3">
            <div class="col-md-3">
                <select class="form-select" id="symbolSelect">
                    <option value="">Выберите символ...</option>
                    <option value="BTCUSDT">BTCUSDT</option>
                    <option value="ETHUSDT">ETHUSDT</option>
                    <option value="SOLUSDT">SOLUSDT</option>
                </select>
            </div>
            <div class="col-md-3">
                <select class="form-select" id="intervalSelect">
                    <option value="1">1m</option>
                    <option value="5">5m</option>
                    <option value="15" selected>15m</option>
                    <option value="30">30m</option>
                    <option value="60">1h</option>
                </select>
            </div>
            <div class="col-md-3">
                <button class="btn btn-primary" id="loadButton">
                    <i class="fas fa-sync-alt me-1"></i>Загрузить
                </button>
            </div>
        </div>
        
        <div class="chart-container" id="chartContainer">
            <div class="text-center p-4">
                <i class="fas fa-chart-line fa-3x text-muted mb-3"></i>
                <p class="text-muted">Выберите символ и нажмите "Загрузить"</p>
            </div>
        </div>
        
        <div class="mt-3">
            <div id="status" class="text-center"></div>
        </div>
    </div>
    
    <script>
        let chart = null;
        
        // Функция для отображения статуса
        function showStatus(message, type = 'info') {
            const statusDiv = document.getElementById('status');
            const icon = type === 'error' ? '❌' : type === 'success' ? '✅' : 'ℹ️';
            statusDiv.innerHTML = `<div class="alert alert-${type === 'error' ? 'danger' : type === 'success' ? 'success' : 'info'}">${icon} ${message}</div>`;
        }
        
        // Функция загрузки данных
        async function loadChartData() {
            try {
                const symbol = document.getElementById('symbolSelect').value;
                const interval = document.getElementById('intervalSelect').value;
                
                if (!symbol) {
                    showStatus('Выберите символ', 'error');
                    return;
                }
                
                showStatus('Загрузка данных...', 'info');
                
                // Показываем индикатор загрузки
                const chartContainer = document.getElementById('chartContainer');
                chartContainer.innerHTML = '<div class="text-center p-4"><i class="fas fa-spinner fa-spin fa-2x"></i><br><br>Загрузка данных...</div>';
                
                // Получаем данные
                const response = await fetch(`/api/klines/${symbol}?interval=${interval}&limit=100`);
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const data = await response.json();
                
                if (data.error) {
                    throw new Error(data.error);
                }
                
                if (!Array.isArray(data) || data.length === 0) {
                    throw new Error('Нет данных для отображения');
                }
                
                showStatus(`Получено ${data.length} записей`, 'success');
                
                // Создаем график
                chartContainer.innerHTML = '';
                
                chart = LightweightCharts.createChart(chartContainer, {
                    width: chartContainer.clientWidth,
                    height: chartContainer.clientHeight,
                    layout: {
                        background: { color: 'rgba(0, 0, 0, 0.2)' },
                        textColor: '#fff',
                    },
                    grid: {
                        vertLines: { color: 'rgba(255, 255, 255, 0.1)' },
                        horzLines: { color: 'rgba(255, 255, 255, 0.1)' },
                    },
                    crosshair: {
                        mode: LightweightCharts.CrosshairMode.Normal,
                    },
                    rightPriceScale: {
                        borderColor: 'rgba(255, 255, 255, 0.2)',
                        textColor: '#fff',
                    },
                    timeScale: {
                        borderColor: 'rgba(255, 255, 255, 0.2)',
                        textColor: '#fff',
                        timeVisible: true,
                        secondsVisible: false,
                    },
                });
                
                const candlestickSeries = chart.addCandlestickSeries({
                    upColor: '#00ff88',
                    downColor: '#ff4757',
                    borderVisible: false,
                    wickUpColor: '#00ff88',
                    wickDownColor: '#ff4757',
                });
                
                candlestickSeries.setData(data);
                
                showStatus(`График загружен: ${symbol} (${data.length} свечей)`, 'success');
                
            } catch (error) {
                console.error('Ошибка:', error);
                showStatus(`Ошибка: ${error.message}`, 'error');
                
                const chartContainer = document.getElementById('chartContainer');
                chartContainer.innerHTML = `<div class="text-center p-4 text-danger">
                    <i class="fas fa-exclamation-triangle fa-2x mb-3"></i><br>
                    Ошибка загрузки данных<br>
                    <small>${error.message}</small>
                </div>`;
            }
        }
        
        // Обработчики событий
        document.getElementById('loadButton').addEventListener('click', loadChartData);
        document.getElementById('symbolSelect').addEventListener('change', function() {
            if (this.value) {
                loadChartData();
            }
        });
        document.getElementById('intervalSelect').addEventListener('change', function() {
            const symbol = document.getElementById('symbolSelect').value;
            if (symbol) {
                loadChartData();
            }
        });
        
        // Обработчик изменения размера окна
        window.addEventListener('resize', function() {
            if (chart) {
                const chartContainer = document.getElementById('chartContainer');
                chart.applyOptions({
                    width: chartContainer.clientWidth,
                    height: chartContainer.clientHeight,
                });
            }
        });
    </script>
</body>
</html>
